name: Deploy TESTE - Debora Denubila

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-teste-debora
  cancel-in-progress: false

env:
  HUB_URL: https://hub.nextepsolutions.com.br

jobs:
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/filipepires1/nextep-debora-web:test-${{ github.sha }}
            ghcr.io/filipepires1/nextep-debora-web:test
          cache-from: type=gha,scope=debora-web
          cache-to: type=gha,mode=max,scope=debora-web

  deploy-test:
    name: Deploy no ambiente de teste
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar containers de teste
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: test-${{ github.sha }}
        with:
          host: 116.203.100.189
          username: filipe
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/nextep/debora-teste
            export IMAGE_TAG
            docker compose -f compose.test.yml pull
            docker compose -f compose.test.yml up -d --remove-orphans
            status="missing"
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' nextep-debora-teste-web 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then break; fi
              sleep 2
            done
            echo "health=$status"
            [ "$status" = "healthy" ]
            docker image prune -f
            docker compose -f compose.test.yml ps

  request-approval:
    name: Solicitar aprovacao no Gestor
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Criar solicitacao de deploy
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "Landing-Page-D-bora-Den-bila" \
            --arg sha "${{ github.sha }}" \
            --arg actor "${{ github.actor }}" \
            --arg msg "$COMMIT_MSG" \
            '{
              repository: $repo,
              branch: "develop",
              commit_hash: $sha,
              author_name: $actor,
              commit_message: $msg,
              environment_slug: "producao"
            }')
          curl -fsS -X POST "$HUB_URL/api/internal/deploy-requests" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.HUB_DEPLOY_TOKEN }}" \
            -d "$PAYLOAD"
