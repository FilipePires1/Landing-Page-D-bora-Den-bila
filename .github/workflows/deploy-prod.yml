name: Deploy PRODUCAO - Debora Denubila

# Producao so sobe por repository_dispatch enviado pelo Gestor apos aprovacao.
on:
  repository_dispatch:
    types: [deploy-production]

permissions:
  contents: read
  packages: write

env:
  HUB_URL: https://hub.nextepsolutions.com.br

jobs:
  verify:
    name: Verificar aprovacao no Gestor
    runs-on: ubuntu-latest
    outputs:
      request_id: ${{ github.event.client_payload.request_id }}
      commit_sha: ${{ github.event.client_payload.commit_sha }}
    steps:
      - name: Consultar status da solicitacao
        run: |
          set -euo pipefail
          REQ="${{ github.event.client_payload.request_id }}"
          SHA="${{ github.event.client_payload.commit_sha }}"
          if [ -z "$REQ" ] || [ -z "$SHA" ]; then
            echo "Payload incompleto"; exit 1
          fi
          STATUS=$(curl -fsS "$HUB_URL/api/internal/deploy-requests/$REQ/status" \
            -H "X-Deploy-Token: ${{ secrets.HUB_DEPLOY_TOKEN }}" | jq -r '.data.status')
          echo "Status da solicitacao: $STATUS"
          if [ "$STATUS" != "approved" ]; then
            echo "Deploy NAO aprovado. Abortando."; exit 1
          fi

  build:
    name: Build e push da imagem
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/filipepires1/nextep-debora-web:${{ needs.verify.outputs.commit_sha }}
            ghcr.io/filipepires1/nextep-debora-web:latest
          cache-from: type=gha,scope=debora-web
          cache-to: type=gha,mode=max,scope=debora-web

  deploy:
    name: Deploy em producao
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar containers de producao
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.verify.outputs.commit_sha }}
        with:
          host: 116.203.100.189
          username: filipe
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/nextep/debora
            export IMAGE_TAG
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans
            status="missing"
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' nextep-debora-web 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then break; fi
              sleep 2
            done
            echo "health=$status"
            [ "$status" = "healthy" ]
            docker image prune -f
            docker compose -f compose.prod.yml ps

      - name: Marcar deploy como concluido no Gestor
        run: |
          curl -fsS -X POST "$HUB_URL/api/internal/deploy-requests/${{ needs.verify.outputs.request_id }}/deployed" \
            -H "X-Deploy-Token: ${{ secrets.HUB_DEPLOY_TOKEN }}"
