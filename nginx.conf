server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Assets estaticos: cache curto para permitir atualizacoes sem nome novo.
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|woff2?|ico|webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML sempre revalidado.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }
}
